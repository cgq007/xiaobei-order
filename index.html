<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>筑波小贝订单</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff7ed;--card:#fff;--line:#f1d7b8;--text:#2b2118;--muted:#7c6f64;--brand:#e58a00;--brand2:#f6a800;--ok:#15803d;--bad:#dc2626;--ink:#111827}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#fff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",Arial,sans-serif;color:var(--text)}.admin{position:fixed;right:18px;top:18px;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;color:#a16207;box-shadow:0 6px 18px #0001;z-index:10}.wrap{max-width:760px;margin:0 auto;padding:28px 16px 44px}.hero{text-align:center;margin:10px 0 20px}.hero h1{font-size:34px;margin:6px 0}.hero p{color:var(--muted);margin:6px 0;white-space:pre-line}.grid{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 35px #9a5b0010}.card h2{font-size:20px;margin:0 0 12px}.products{display:grid;gap:12px}.product{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}.product strong{font-size:17px}.small{font-size:13px;color:var(--muted);line-height:1.6;white-space:pre-line}.price{font-weight:800;color:#b45309}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:999px;border:1px solid var(--line);background:#fff}.qty span{min-width:22px;text-align:center;font-weight:700}.note{border:1px dashed #f59e0b;background:#fffbeb;border-radius:14px;padding:12px;color:#92400e;line-height:1.7;white-space:pre-line}label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #e8c99f;border-radius:12px;padding:12px;font-size:16px;background:white}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.full{margin-bottom:12px}.btn{width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(90deg,var(--brand),var(--brand2));color:white;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.btn.ghost{background:#fff;color:#9a5b00;border:1px solid var(--line)}.btn.dark{background:#111827}.total{font-weight:900;font-size:20px;margin:8px 0 12px}.success,.err{display:none;border-radius:14px;padding:14px;margin-top:12px;line-height:1.7}.success{background:#ecfdf5;border:1px solid #86efac;color:#065f46}.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.footer{text-align:center;color:#9a8b80;margin-top:28px}.modalMask{display:none;position:fixed;inset:0;background:#0006;z-index:99;padding:18px;overflow:auto}.modal{background:white;border-radius:18px;max-width:1080px;margin:20px auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px}.close{border:0;background:#f3f4f6;border-radius:999px;width:34px;height:34px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.tab.active{background:#111827;color:#fff}.section{display:none}.section.active{display:block}table{border-collapse:collapse;width:100%;font-size:13px;background:white}th,td{border:1px solid #e5e7eb;padding:8px;vertical-align:top}th{background:#f9fafb}.pill{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:2px 8px;background:#f9fafb}.config{display:grid;gap:10px}.pedit{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px}.adminStatus{margin:10px 0;color:#065f46;font-size:13px}.danger{color:var(--bad)}.hint{font-size:12px;color:#7c6f64;font-weight:400}@media(max-width:640px){.row{grid-template-columns:1fr}.hero h1{font-size:28px}.product{align-items:flex-start;flex-direction:column}.qty{width:100%;justify-content:flex-end}.wrap{padding-top:50px}}
</style>
</head>
<body>
<button class="admin" onclick="openAdmin()">管理</button>
<div class="wrap">
<header class="hero"><h1 id="site_title">筑波小贝</h1><p id="site_subtitle">本周限定手作小贝预订</p></header>
<div class="grid">
<section class="card"><h2 id="products_title">今日可预订</h2><div id="productsBox" class="products"></div><div class="note" id="notice_text"></div></section>
<section class="card"><h2 id="form_title">填写配送信息</h2><form id="orderForm">
<div class="row"><div><label>微信名 *</label><input id="wechat" required placeholder="例如：小陈"></div><div><label>联系电话</label><input id="phone" placeholder="可不填"></div></div>
<div class="full"><label>配送地址 *</label><input id="address" required placeholder="宿舍/公寓名 + 房间号，或可见面地点"></div>
<div class="row"><div><label>配送区域 *</label><select id="area" required><option value="">请选择</option><option>筑波大学宿舍/校内</option><option>天久保</option><option>春日</option><option>桜</option><option>研究学园</option><option>其他</option></select></div><div><label>希望送达时间 *</label><select id="delivery_time" required><option value="">请选择</option></select></div></div>
<div class="full"><label>付款方式 *</label><select id="pay_method" required></select></div>
<div class="full"><label>备注</label><textarea id="remark" placeholder="例如：不要太多沙拉酱 / 到楼下请发微信"></textarea></div>
<div class="total">合计：<span id="total">0</span> 日元</div><button class="btn" id="submitBtn" type="submit">提交订单</button><div id="success" class="success"></div><div id="errorBox" class="err"></div>
</form></section>
<section class="card"><h2 id="guide_title">购买说明</h2><div class="small" id="guide_text"></div></section>
<section class="card"><h2>联系店主</h2><div class="small" id="contact_text"></div></section>
</div><div class="footer" id="footer_text"></div></div>
<div class="modalMask" id="mask"><div class="modal"><div class="head"><h2>店主后台</h2><button class="close" onclick="closeAdmin()">×</button></div>
<div id="login"><p class="small">请使用 Supabase Auth 管理员邮箱登录。密码不会写在网页代码里。</p><div class="row"><input id="adminEmail" type="email" placeholder="管理员邮箱"><input id="adminPass" type="password" placeholder="管理员密码"></div><button class="btn dark" onclick="loginAdmin()">登录后台</button><div id="loginErr" class="err"></div></div>
<div id="panel" style="display:none"><div class="adminStatus">已登录：<span id="adminUser"></span> <button class="tab" onclick="logoutAdmin()">退出登录</button></div><div class="tabs"><button class="tab active" onclick="tab('ordersTab',this)">订单</button><button class="tab" onclick="tab('productsTab',this)">商品库存</button><button class="tab" onclick="tab('settingsTab',this)">页面文案/选项</button></div>
<div class="section active" id="ordersTab"><button class="btn ghost" onclick="loadOrders()">刷新订单</button><button class="btn ghost" style="margin-top:8px" onclick="exportCSV()">导出CSV</button><div id="ordersBox" style="overflow:auto;margin-top:10px"></div></div>
<div class="section" id="productsTab"><div id="productEditor"></div><button class="btn ghost" onclick="addProduct()">新增商品</button><button class="btn" style="margin-top:8px" onclick="saveProducts()">保存商品/库存</button></div>
<div class="section" id="settingsTab"><div class="config" id="settingsEditor"></div><button class="btn" style="margin-top:10px" onclick="saveSettings()">保存页面文案/选项</button></div>
</div></div></div>
<script>
const SUPABASE_URL='https://xmspzhqggxgwqlwiwnpp.supabase.co';
const SUPABASE_KEY='sb_publishable_iHnij0EUv1-jVfoubkVWLw_TlonrWCY';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DEFAULT_SETTINGS={
  site_title:'筑波小贝',
  site_subtitle:'本周限定手作小贝预订｜数量有限，售完即止',
  products_title:'今日可预订',
  notice_text:'下单后请添加/联系店主微信确认付款。提交成功后会自动生成订单编号，请截图保存。',
  form_title:'填写配送信息',
  guide_title:'购买说明',
  guide_text:'请准确填写微信名、配送地址和希望送达时间。下单后请截图联系店主确认付款。',
  contact_text:'微信：请在后台 site_settings 中填写 contact_text',
  footer_text:'© 筑波小贝｜预订制手作点心',
  delivery_time_options:'午前\n12:00-14:00\n14:00-16:00\n16:00-18:00\n18:00-20:00\n另行联系',
  payment_method_options:'PayPay\n现金\n银行转账'
};
let settings={...DEFAULT_SETTINGS};let products=[];let cart={};let orders=[];
function yen(n){return Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function lines(v){return String(v||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean)}
function setSelectOptions(id,opts,needBlank=true){const el=document.getElementById(id);if(!el)return;const current=el.value;el.innerHTML=(needBlank?'<option value="">请选择</option>':'')+opts.map(x=>`<option>${esc(x)}</option>`).join('');if(opts.includes(current))el.value=current}
function renderDynamicOptions(){setSelectOptions('delivery_time',lines(settings.delivery_time_options||DEFAULT_SETTINGS.delivery_time_options),true);setSelectOptions('pay_method',lines(settings.payment_method_options||DEFAULT_SETTINGS.payment_method_options),false)}
async function init(){await loadSettings();await loadProducts();await checkSession();renderSettings();renderProducts()}init();
async function loadSettings(){const {data,error}=await db.from('site_settings').select('*');if(!error&&data){data.forEach(r=>{settings[r.setting_key]=r.setting_value})}}
async function loadProducts(){const {data,error}=await db.from('products').select('*').eq('is_active',true).order('id',{ascending:true});if(error){showErr('读取商品失败：'+error.message);products=[]}else{products=data||[]}}
function renderSettings(){Object.keys(DEFAULT_SETTINGS).forEach(k=>{const el=document.getElementById(k);if(el)el.innerHTML=esc(settings[k]??DEFAULT_SETTINGS[k])});renderDynamicOptions()}
function renderProducts(){const box=document.getElementById('productsBox');if(!products.length){box.innerHTML='<p class="small">今天暂未开放预订。</p>';return}box.innerHTML='';products.forEach((p,i)=>{const key=p.id??('f'+i);cart[key]=cart[key]||0;const sold=Number(p.stock||0)<=0;box.insertAdjacentHTML('beforeend',`<div class="product"><div><strong>${esc(p.name)}</strong><div class="small">${esc(p.description||'')}</div><div class="price">${yen(p.price)} 日元 / 个</div><div class="small">剩余：${esc(p.stock)} 个</div></div><div class="qty"><button type="button" onclick="changeQty('${key}',-1)" ${sold?'disabled':''}>-</button><span id="q${key}">${cart[key]}</span><button type="button" onclick="changeQty('${key}',1)" ${sold?'disabled':''}>+</button></div></div>`)})}
function changeQty(key,d){const p=products.find((x,i)=>(x.id??('f'+i))==key);const max=Number(p?.stock||0);cart[key]=Math.max(0,Math.min(max,(cart[key]||0)+d));document.getElementById('q'+key).textContent=cart[key];calcTotal()}
function calcTotal(){let t=0;products.forEach((p,i)=>{const key=p.id??('f'+i);t+=Number(p.price||0)*(cart[key]||0)});total.textContent=yen(t);return t}
function showErr(msg){errorBox.style.display='block';errorBox.textContent=msg}function hideMsg(){errorBox.style.display='none';success.style.display='none'}
orderForm.addEventListener('submit',async e=>{e.preventDefault();hideMsg();const selected=products.map((p,i)=>({p,key:p.id??('f'+i),qty:cart[p.id??('f'+i)]||0})).filter(x=>x.qty>0);if(!selected.length){alert('请至少选择一个商品');return}const orderNo='XB'+Date.now().toString().slice(-8);const items=selected.map(x=>({product_id:Number.isFinite(Number(x.p.id))?Number(x.p.id):null,product_name:x.p.name,quantity:x.qty,unit_price:Number(x.p.price||0),subtotal:Number(x.p.price||0)*x.qty}));submitBtn.disabled=true;submitBtn.textContent='提交中...';try{const {error}=await db.rpc('place_order',{p_order_code:orderNo,p_customer_name:wechat.value,p_wechat:wechat.value,p_phone:phone.value,p_address:address.value,p_area:area.value,p_delivery_time:delivery_time.value,p_payment_method:pay_method.value,p_items:items,p_remark:remark.value||''});if(error)throw error;success.style.display='block';success.innerHTML=`提交成功！订单编号：<b>${orderNo}</b><br>合计：<b>${yen(calcTotal())}日元</b><br>请截图并联系店主确认付款。`;orderForm.reset();cart={};await loadProducts();renderProducts();calcTotal()}catch(err){showErr('提交失败：'+err.message)}finally{submitBtn.disabled=false;submitBtn.textContent='提交订单'}})
function openAdmin(){mask.style.display='block'}function closeAdmin(){mask.style.display='none'}async function checkSession(){const {data}=await db.auth.getSession();if(data.session){showPanel(data.session.user)}}function showPanel(user){login.style.display='none';panel.style.display='block';adminUser.textContent=user.email||user.id;renderProductEditor();renderSettingsEditor();loadOrders()}async function loginAdmin(){loginErr.style.display='none';const {data,error}=await db.auth.signInWithPassword({email:adminEmail.value,password:adminPass.value});if(error){loginErr.style.display='block';loginErr.textContent='登录失败：'+error.message;return}showPanel(data.user)}async function logoutAdmin(){await db.auth.signOut();panel.style.display='none';login.style.display='block'}function tab(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function loadOrders(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){alert('读取订单失败：'+error.message);return}orders=data||[];renderOrders()}function itemText(o){if(Array.isArray(o.items)){return o.items.map(i=>`${esc(i.product_name)} × ${esc(i.quantity)}（${yen(i.subtotal)}円）`).join('<br>')}return `${esc(o.product_name)} × ${esc(o.quantity)}`}function renderOrders(){if(!orders.length){ordersBox.innerHTML='<p class="small">暂无订单</p>';return}ordersBox.innerHTML='<table><tr><th>订单号/时间</th><th>客户</th><th>商品明细</th><th>区域/地址</th><th>金额/状态</th></tr>'+orders.map(o=>`<tr><td><b>${esc(o.order_code||'')}</b><br>${esc(o.created_at||'')}</td><td>${esc(o.wechat||o.customer_name)}<br>${esc(o.phone||'')}<br>${esc(o.payment_method||'')}</td><td>${itemText(o)}</td><td><span class="pill">${esc(o.area)}</span><br>${esc(o.address)}<br>${esc(o.delivery_time)}<br>${esc(o.remark||'')}</td><td>${yen(o.total_price)}<br>${esc(o.order_status||'')}</td></tr>`).join('')+'</table>'}
function renderProductEditor(){productEditor.innerHTML='';products.forEach((p,i)=>productEditor.insertAdjacentHTML('beforeend',`<div class="pedit"><label>商品名</label><input id="pn${i}" value="${esc(p.name)}"><label>说明</label><input id="pd${i}" value="${esc(p.description||'')}"><div class="row"><div><label>价格</label><input id="pp${i}" type="number" value="${p.price}"></div><div><label>库存</label><input id="ps${i}" type="number" value="${p.stock}"></div></div><label><input id="pa${i}" type="checkbox" ${p.is_active?'checked':''} style="width:auto"> 上架</label></div>`))}
function addProduct(){products.push({name:'新商品',description:'',price:300,stock:0,is_active:true});renderProductEditor()}async function saveProducts(){const rows=products.map((p,i)=>({id:p.id,name:document.getElementById('pn'+i).value,description:document.getElementById('pd'+i).value,price:Number(document.getElementById('pp'+i).value||0),stock:Number(document.getElementById('ps'+i).value||0),is_active:document.getElementById('pa'+i).checked}));for(const r of rows){let error;if(r.id){({error}=await db.from('products').update(r).eq('id',r.id))}else{delete r.id;({error}=await db.from('products').insert([r]))}if(error){alert('保存失败：'+error.message);return}}await loadProducts();renderProducts();renderProductEditor();alert('已保存')}
function renderSettingsEditor(){settingsEditor.innerHTML='';Object.keys(DEFAULT_SETTINGS).forEach(k=>{const hint=(k==='delivery_time_options'||k==='payment_method_options')?' <span class="hint">每行一个选项；保存后前台下拉框会更新</span>':'';settingsEditor.insertAdjacentHTML('beforeend',`<label>${k}${hint}</label><textarea id="set_${k}">${esc(settings[k]??DEFAULT_SETTINGS[k]??'')}</textarea>`)})}
async function saveSettings(){const rows=Object.keys(DEFAULT_SETTINGS).map(k=>({setting_key:k,setting_value:document.getElementById('set_'+k).value}));const {error}=await db.from('site_settings').upsert(rows,{onConflict:'setting_key'});if(error){alert('保存失败：'+error.message);return}await loadSettings();renderSettings();alert('已保存')}
function exportCSV(){const rows=[['订单号','时间','微信','电话','区域','地址','送达时间','付款方式','商品明细','总数量','总价','备注','状态']];orders.forEach(o=>{const detail=Array.isArray(o.items)?o.items.map(i=>`${i.product_name}x${i.quantity}`).join(' / '):`${o.product_name}x${o.quantity}`;rows.push([o.order_code,o.created_at,o.wechat,o.phone,o.area,o.address,o.delivery_time,o.payment_method,detail,o.quantity,o.total_price,o.remark,o.order_status])});const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='xiaobei_orders.csv';a.click()}
</script>
</body></html>
