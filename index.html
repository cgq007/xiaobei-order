<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>筑波小贝订单</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff7ed;--card:#fff;--line:#f1d7b8;--text:#2b2118;--muted:#7c6f64;--brand:#e58a00;--brand2:#f6a800;--ok:#15803d;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#fff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.admin{position:fixed;right:14px;top:14px;z-index:9;border:1px solid #f1c27d;background:#fffaf0;color:#9a5a00;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;box-shadow:0 8px 20px #0001;cursor:pointer}header{text-align:center;padding:44px 18px 20px}h1{margin:0;font-size:30px}.sub{white-space:pre-line;color:var(--muted);line-height:1.7;margin-top:8px}.wrap{max-width:980px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 12px 32px rgba(120,70,0,.07)}h2{font-size:18px;margin:0 0 14px}.product{display:flex;gap:12px;align-items:center;border:1px solid #f1dfc7;border-radius:16px;padding:12px;margin-bottom:10px;background:#fffaf3}.pic{width:68px;height:68px;border-radius:14px;background:linear-gradient(135deg,#fed7aa,#fff,#fbbf24);display:flex;align-items:center;justify-content:center;font-size:30px}.pinfo{flex:1}.pname{font-weight:800}.pmeta{font-size:13px;color:var(--muted);line-height:1.5}.qty{display:flex;gap:6px;align-items:center}.qty button{width:32px;height:32px;border:0;border-radius:9px;background:#fef3c7;color:#92400e;font-size:18px}.qty input{width:42px;height:32px;border:1px solid var(--line);border-radius:9px;text-align:center}.note{background:#fffbeb;border:1px dashed #f59e0b;border-radius:14px;padding:12px;color:#6b4e16;line-height:1.7;white-space:pre-line}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #ead3b5;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:72px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}.total{font-weight:900;font-size:20px;margin:12px 0}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px;font-size:17px;font-weight:900;cursor:pointer}.btn.ghost{background:#fff7ed;color:#92400e;border:1px solid #f1c27d}.btn.dark{background:#2b2118}.success{display:none;background:#ecfdf5;border:1px solid #86efac;color:#166534;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.err{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.small{font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-line}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;white-space:pre-line}.modalMask{display:none;position:fixed;inset:0;background:#0006;z-index:20;padding:18px;overflow:auto}.modal{max-width:1050px;margin:20px auto;background:#fff;border-radius:20px;padding:18px;border:1px solid var(--line)}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#fff7ed;border-radius:50%;width:34px;height:34px;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid #f1c27d;background:#fff7ed;color:#92400e;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tab.active{background:#92400e;color:#fff}.section{display:none}.section.active{display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #f0dec8;padding:8px;vertical-align:top;text-align:left}th{background:#fff7ed;color:#6b4e16}.pill{display:inline-block;border-radius:999px;background:#fef3c7;color:#92400e;padding:3px 8px;margin:2px}.config{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.config{grid-template-columns:1fr}}.danger{color:var(--bad)}
</style>
</head>
<body>
<button class="admin" onclick="openAdmin()">管理</button>
<header><h1 id="site_title">筑波小贝屋 🐚</h1><div class="sub" id="site_subtitle"></div></header>
<div class="wrap"><div class="grid"><section>
<div class="card"><h2 id="products_title">今日可预订</h2><div id="productsBox"></div><div class="note" id="notice_text"></div></div>
<div class="card"><h2 id="form_title">填写配送信息</h2><form id="orderForm">
<div class="row"><div><label>微信名 *</label><input id="wechat" required placeholder="例如：小陈"></div><div><label>联系电话</label><input id="phone" placeholder="可不填"></div></div>
<label>配送地址 *</label><input id="address" required placeholder="宿舍/公寓名 + 房间号，或可见面地点">
<div class="row"><div><label>配送区域 *</label><select id="area" required><option value="">请选择</option><option>筑波大学宿舍/校内</option><option>天久保</option><option>春日</option><option>桜</option><option>研究学园</option><option>其他</option></select></div><div><label>希望送达时间 *</label><select id="delivery_time" required><option value="">请选择</option><option>12:00-14:00</option><option>14:00-16:00</option><option>16:00-18:00</option><option>18:00-20:00</option><option>都可以</option></select></div></div>
<label>付款方式 *</label><select id="pay_method" required><option>PayPay</option><option>现金</option><option>银行转账</option></select>
<label>备注</label><textarea id="remark" placeholder="例如：不要太多沙拉酱 / 到楼下请发微信"></textarea>
<div class="total">合计：<span id="total">0</span> 日元</div><button class="btn" id="submitBtn" type="submit">提交订单</button><div id="success" class="success"></div><div id="errorBox" class="err"></div>
</form></div></section><aside><div class="card"><h2 id="guide_title">购买说明</h2><div class="small" id="guide_text"></div></div><div class="card"><h2>联系店主</h2><div class="small" id="contact_text"></div></div></aside></div></div>
<div class="footer" id="footer_text"></div>
<div class="modalMask" id="mask"><div class="modal"><div class="head"><h2>店主后台</h2><button class="close" onclick="closeAdmin()">×</button></div><div id="login"><input id="pass" type="password" placeholder="输入管理密码"><button class="btn dark" style="margin-top:10px" onclick="loginAdmin()">进入后台</button><p class="small">默认密码：1234</p></div><div id="panel" style="display:none"><div class="tabs"><button class="tab active" onclick="tab('ordersTab',this)">订单</button><button class="tab" onclick="tab('productsTab',this)">商品库存</button><button class="tab" onclick="tab('settingsTab',this)">页面文案</button></div><div class="section active" id="ordersTab"><button class="btn ghost" onclick="loadOrders()">刷新订单</button><button class="btn ghost" style="margin-top:8px" onclick="exportCSV()">导出CSV</button><div id="ordersBox" style="overflow:auto;margin-top:10px"></div></div><div class="section" id="productsTab"><div id="productEditor"></div><button class="btn ghost" onclick="addProduct()">新增商品</button><button class="btn" style="margin-top:8px" onclick="saveProducts()">保存商品/库存</button></div><div class="section" id="settingsTab"><div class="config" id="settingsEditor"></div><button class="btn" style="margin-top:10px" onclick="saveSettings()">保存页面文案</button></div></div></div></div>
<script>
const SUPABASE_URL='https://xmspzhqggxgwqlwiwnpp.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_iHnij0EUv1-jVfoubkVWLw_TlonrWCY';
const ADMIN_PASSWORD='1234';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const DEFAULT_SETTINGS={site_title:'筑波小贝屋 🐚',site_subtitle:'本周手作肉松小贝预订｜数量有限，售完即止\n筑波大学・天久保・春日・研究学园周边可配送',products_title:'今日可预订',notice_text:'下单后请联系店主微信确认付款。提交成功后会自动生成订单编号，请截图保存。',form_title:'填写配送信息',guide_title:'购买说明',guide_text:'价格：300日元/个起。\n保存：建议当天食用，冷藏后口感会变化。\n过敏原：鸡蛋、小麦、乳制品、蛋黄酱等。',contact_text:'微信：请填写你的微信号\n付款：PayPay / 现金\n配送：根据订单区域统一配送',footer_text:'© 筑波小贝屋｜预订制手作点心'};
let settings={...DEFAULT_SETTINGS};let products=[];let cart={};let orders=[];
const fallbackProducts=[{id:null,name:'经典肉松小贝',description:'咸甜肉松 + 蛋黄酱，招牌款',price:300,stock:24,is_active:true},{id:null,name:'奶油小贝',description:'轻甜奶油，适合不吃肉松的人',price:300,stock:12,is_active:true},{id:null,name:'芋泥肉松小贝',description:'芋泥 + 肉松，限定款',price:350,stock:12,is_active:true}];
function yen(n){return Number(n||0).toLocaleString('ja-JP')}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function init(){await loadSettings();await loadProducts();renderSettings();renderProducts()}async function loadSettings(){const {data,error}=await db.from('site_settings').select('*');if(!error&&data){data.forEach(r=>{settings[r.setting_key]=r.setting_value})}}
async function loadProducts(){const {data,error}=await db.from('products').select('*').eq('is_active',true).order('id',{ascending:true});if(error){showErr('读取商品失败：'+error.message);products=fallbackProducts}else if(data&&data.length){products=data}else{products=fallbackProducts}}
function renderSettings(){Object.entries(settings).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.textContent=v});document.title=settings.site_title||'小贝订单'}
function renderProducts(){const box=document.getElementById('productsBox');box.innerHTML='';products.forEach((p,i)=>{const key=p.id??('f'+i);cart[key]=cart[key]||0;const sold=Number(p.stock)<=0;box.insertAdjacentHTML('beforeend',`<div class="product"><div class="pic">🐚</div><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.description||'')}<br>${yen(p.price)}日元/个｜剩余 <b class="${sold?'danger':''}">${yen(p.stock)}</b> 个</div></div><div class="qty"><button type="button" onclick="changeQty('${key}',-1)">−</button><input id="qty_${key}" value="${cart[key]}" readonly><button type="button" onclick="changeQty('${key}',1)" ${sold?'disabled':''}>＋</button></div></div>`)});calcTotal()}
function findProduct(key){return products.find((p,i)=>String(p.id??('f'+i))===String(key))}function changeQty(key,d){const p=findProduct(key);cart[key]=Math.max(0,Math.min(Number(p.stock||0),(cart[key]||0)+d));document.getElementById('qty_'+key).value=cart[key];calcTotal()}function calcTotal(){let t=0;products.forEach((p,i)=>{const k=p.id??('f'+i);t+=(cart[k]||0)*Number(p.price||0)});total.textContent=yen(t);return t}
function showErr(msg){errorBox.style.display='block';errorBox.textContent=msg}function hideMsg(){errorBox.style.display='none';success.style.display='none'}
orderForm.addEventListener('submit',async e=>{e.preventDefault();hideMsg();const selected=products.map((p,i)=>({p,key:p.id??('f'+i),qty:cart[p.id??('f'+i)]||0})).filter(x=>x.qty>0);if(!selected.length){alert('请至少选择一个商品');return}const orderNo='XB'+Date.now().toString().slice(-8);const totalPrice=calcTotal();submitBtn.disabled=true;submitBtn.textContent='提交中...';try{const rows=selected.map(x=>({customer_name:wechat.value,wechat:wechat.value,phone:phone.value,address:address.value,area:area.value,product_id:Number.isFinite(Number(x.p.id))?Number(x.p.id):null,product_name:x.p.name,quantity:x.qty,unit_price:Number(x.p.price||0),total_price:Number(x.p.price||0)*x.qty,delivery_time:delivery_time.value,remark:`订单号:${orderNo}｜付款:${pay_method.value}｜${remark.value||''}`,order_status:'pending'}));const {error}=await db.from('orders').insert(rows);if(error)throw error;for(const x of selected){if(x.p.id!=null){await db.from('products').update({stock:Number(x.p.stock||0)-x.qty}).eq('id',x.p.id)}}success.style.display='block';success.innerHTML=`提交成功！订单编号：<b>${orderNo}</b><br>合计：<b>${yen(totalPrice)}日元</b><br>请截图并联系店主确认付款。`;orderForm.reset();cart={};await loadProducts();renderProducts()}catch(err){showErr('提交失败：'+err.message)}finally{submitBtn.disabled=false;submitBtn.textContent='提交订单'}})
function openAdmin(){mask.style.display='block'}function closeAdmin(){mask.style.display='none'}function loginAdmin(){if(pass.value!==ADMIN_PASSWORD){alert('密码错误');return}login.style.display='none';panel.style.display='block';renderProductEditor();renderSettingsEditor();loadOrders()}function tab(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function loadOrders(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}orders=data||[];renderOrders()}function renderOrders(){if(!orders.length){ordersBox.innerHTML='<p class="small">暂无订单</p>';return}ordersBox.innerHTML='<table><tr><th>时间</th><th>客户</th><th>商品</th><th>区域/地址</th><th>金额/状态</th></tr>'+orders.map(o=>`<tr><td>${esc(o.created_at||'')}</td><td>${esc(o.wechat||o.customer_name)}<br>${esc(o.phone||'')}</td><td>${esc(o.product_name)} × ${esc(o.quantity)}</td><td><span class="pill">${esc(o.area)}</span><br>${esc(o.address)}<br>${esc(o.delivery_time)}<br>${esc(o.remark||'')}</td><td>${yen(o.total_price)}<br>${esc(o.order_status||'')}</td></tr>`).join('')+'</table>'}
function renderProductEditor(){productEditor.innerHTML='';products.forEach((p,i)=>productEditor.insertAdjacentHTML('beforeend',`<div class="card"><input type="hidden" id="pid${i}" value="${esc(p.id??'')}"><label>商品名</label><input id="pn${i}" value="${esc(p.name)}"><div class="row"><div><label>价格</label><input id="pp${i}" type="number" value="${p.price||0}"></div><div><label>库存</label><input id="ps${i}" type="number" value="${p.stock||0}"></div></div><label>说明</label><input id="pd${i}" value="${esc(p.description||'')}"><label><input id="pa${i}" type="checkbox" ${p.is_active!==false?'checked':''} style="width:auto"> 上架显示</label></div>`))}function addProduct(){products.push({id:null,name:'新商品',description:'',price:300,stock:0,is_active:true});renderProductEditor()}
async function saveProducts(){const rows=products.map((p,i)=>({id:document.getElementById('pid'+i).value||undefined,name:document.getElementById('pn'+i).value,description:document.getElementById('pd'+i).value,price:+document.getElementById('pp'+i).value,stock:+document.getElementById('ps'+i).value,is_active:document.getElementById('pa'+i).checked}));for(const r of rows){if(!r.id) delete r.id;const {error}=await db.from('products').upsert(r);if(error){alert(error.message);return}}await loadProducts();renderProducts();renderProductEditor();alert('已保存')}
function renderSettingsEditor(){settingsEditor.innerHTML='';Object.keys(DEFAULT_SETTINGS).forEach(k=>settingsEditor.insertAdjacentHTML('beforeend',`<div><label>${k}</label><textarea id="set_${k}">${esc(settings[k]||'')}</textarea></div>`))}async function saveSettings(){const rows=Object.keys(DEFAULT_SETTINGS).map(k=>({setting_key:k,setting_value:document.getElementById('set_'+k).value}));const {error}=await db.from('site_settings').upsert(rows,{onConflict:'setting_key'});if(error){alert(error.message);return}await loadSettings();renderSettings();alert('已保存页面文案')}
function exportCSV(){const rows=[['时间','微信','电话','区域','地址','送达时间','商品','数量','单价','总价','备注','状态']];orders.forEach(o=>rows.push([o.created_at,o.wechat,o.phone,o.area,o.address,o.delivery_time,o.product_name,o.quantity,o.unit_price,o.total_price,o.remark,o.order_status]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='xiaobei_orders.csv';a.click()}
init();
</script>
</body></html>
