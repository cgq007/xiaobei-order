<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筑波小贝订单系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#fff7ed;--card:#fff;--text:#2b2118;--muted:#7c6f64;--brand:#d97706;--brand2:#f59e0b;--line:#f2d8b8;--danger:#dc2626;--ok:#16a34a;}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(180deg,#fff7ed,#fff);color:var(--text)}
    .admin-mini{position:fixed;right:12px;top:12px;z-index:50;border:1px solid #f1c27d;background:rgba(255,251,235,.92);color:#92400e;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;box-shadow:0 6px 18px rgba(146,92,20,.14);cursor:pointer;backdrop-filter:blur(8px)}
    header{padding:38px 18px 18px;text-align:center;background:radial-gradient(circle at top,#ffedd5 0,#fff7ed 50%,transparent 100%)}
    h1{margin:0;font-size:30px;letter-spacing:.5px}.sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line}
    main{max-width:960px;margin:0 auto;padding:16px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(146,92,20,.08);padding:18px;margin-bottom:16px}h2{font-size:18px;margin:0 0 14px}
    .note{background:#fffbeb;border:1px dashed #f59e0b;border-radius:14px;padding:12px;color:#6b4e16;font-size:14px;line-height:1.7;white-space:pre-line}
    .product{display:flex;gap:12px;align-items:center;border:1px solid #f1dfc7;border-radius:16px;padding:12px;margin-bottom:10px;background:#fffaf3}.pic{width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,#fed7aa,#fff,#fbbf24);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}.pinfo{flex:1}.pname{font-weight:700}.pmeta{font-size:13px;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#fef3c7;font-size:20px;color:#92400e}.qty button:disabled{opacity:.45}.qty input{width:42px;text-align:center;border:1px solid var(--line);border-radius:10px;height:34px;font-size:16px}
    label{display:block;font-size:14px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #ead3b5;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:72px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
    .total{font-size:20px;font-weight:800;margin:10px 0}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px;font-size:17px;font-weight:800;cursor:pointer}.btn.secondary{background:#2b2118}.btn.ghost{background:#fff7ed;color:#92400e;border:1px solid #f1c27d}.btn.dangerBtn{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.small{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-line}.success{display:none;background:#ecfdf5;border:1px solid #86efac;color:#166534;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.danger{color:var(--danger)}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #f0dec8;padding:8px;text-align:left;vertical-align:top}th{color:#6b4e16;background:#fff7ed}.pill{display:inline-block;border-radius:999px;background:#fef3c7;color:#92400e;padding:3px 8px;font-size:12px;margin:2px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;white-space:pre-line}.warn{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:14px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:14px}
    .modalMask{display:none;position:fixed;inset:0;background:rgba(43,33,24,.38);z-index:80;padding:18px;overflow:auto}.modal{max-width:980px;margin:30px auto;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(43,33,24,.28);padding:18px}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.close{border:0;background:#fff7ed;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{border:1px solid #f1c27d;background:#fff7ed;color:#92400e;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.tab.active{background:#92400e;color:#fff}.adminSection{display:none}.adminSection.active{display:block}.configGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.configGrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <button class="admin-mini" onclick="openAdminModal()">管理</button>
  <header><h1 id="siteTitle"></h1><div class="sub" id="siteSubtitle"></div></header>
  <main><div class="grid"><section><div class="card"><h2 id="productsTitle"></h2><div id="products"></div><div class="note" id="orderNote"></div></div><div class="card"><h2 id="formTitle"></h2><form id="orderForm"><div class="row"><div><label>微信名 *</label><input id="wechat" required placeholder="例如：小陈" /></div><div><label>联系电话</label><input id="phone" placeholder="可不填" /></div></div><label>配送地址 *</label><input id="address" required placeholder="宿舍/公寓名 + 房间号，或可见面地点" /><div class="row"><div><label>配送区域 *</label><select id="area" required><option value="">请选择</option><option>筑波大学宿舍/校内</option><option>天久保</option><option>春日</option><option>桜</option><option>研究学园</option><option>其他</option></select></div><div><label>希望送达时间 *</label><select id="delivery" required><option value="">请选择</option><option>12:00-14:00</option><option>14:00-16:00</option><option>16:00-18:00</option><option>18:00-20:00</option><option>都可以</option></select></div></div><label>付款方式 *</label><select id="pay" required><option value="PayPay">PayPay</option><option value="现金">现金</option><option value="银行转账">银行转账</option></select><label>备注</label><textarea id="memo" placeholder="例如：不要太多沙拉酱 / 到楼下请发微信"></textarea><div class="total">合计：<span id="total">0</span> 日元</div><button class="btn" type="submit" id="submitBtn">提交订单</button><div id="success" class="success"></div></form></div></section><aside><div class="card"><h2 id="guideTitle"></h2><p class="small" id="guideText"></p></div><div class="card"><h2 id="contactTitle"></h2><p class="small" id="contactText"></p></div></aside></div></main><div class="footer" id="footerText"></div>
  <div class="modalMask" id="adminMask"><div class="modal"><div class="modalHead"><h2>店主后台</h2><button class="close" onclick="closeAdminModal()">×</button></div><div id="loginBox"><input id="adminPass" type="password" placeholder="输入管理密码" /><button class="btn secondary" style="margin-top:10px" onclick="loginAdmin()">进入后台</button><p class="small">默认密码：1234。上线前建议在代码里修改 ADMIN_PASSWORD。</p></div><div id="adminBox" style="display:none"><div id="dbWarn" class="warn" style="display:none"></div><div class="tabs"><button class="tab active" onclick="showTab('ordersTab',this)">订单</button><button class="tab" onclick="showTab('productsTab',this)">商品库存</button><button class="tab" onclick="showTab('textsTab',this)">页面文案</button></div><div id="ordersTab" class="adminSection active"><button class="btn ghost" onclick="loadOrders()">刷新订单</button><button class="btn ghost" style="margin-top:8px" onclick="exportCSV()">导出CSV</button><div id="orders" style="overflow:auto;margin-top:10px"></div></div><div id="productsTab" class="adminSection"><div id="stockEditor"></div><button class="btn ghost" onclick="addProduct()">新增商品</button><button class="btn" style="margin-top:8px" onclick="saveProducts()">保存商品/库存</button></div><div id="textsTab" class="adminSection"><div class="configGrid" id="textEditor"></div><button class="btn" style="margin-top:12px" onclick="saveSettings()">保存页面文案</button></div></div></div></div>
<script>
// ====== 上线前在这里填 Supabase 信息 ======
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
const ADMIN_PASSWORD = '1234';
// ==========================================
const isConfigured = SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.includes('PASTE_');
const sb = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const DEFAULT_SETTINGS={siteTitle:'筑波小贝屋 🐚',siteSubtitle:'本周手作肉松小贝预订｜数量有限，售完即止\n筑波大学・天久保・春日・研究学园周边可配送',productsTitle:'今日可预订',orderNote:'下单后请添加/联系店主微信确认付款。提交成功后会自动生成订单编号，请截图保存。',formTitle:'填写配送信息',guideTitle:'购买说明',guideText:'价格：300日元/个起。\n保存：建议当天食用，冷藏后口感会变化。\n过敏原：鸡蛋、小麦、乳制品、蛋黄酱等。\n取消：制作前可取消，制作后原则上不可取消。',contactTitle:'联系店主',contactText:'微信：请在这里填写你的微信号\n付款：PayPay / 现金\n配送：根据订单区域统一配送',footerText:'© 筑波小贝屋｜预订制手作点心'};
let settings={...DEFAULT_SETTINGS};
let products=[{id:'classic',name:'经典肉松小贝',price:300,stock:24,desc:'咸甜肉松 + 蛋黄酱，招牌款',active:true},{id:'cream',name:'奶油小贝',price:300,stock:12,desc:'轻甜奶油，适合不吃肉松的人',active:true},{id:'taro',name:'芋泥肉松小贝',price:350,stock:12,desc:'芋泥 + 肉松，限定款',active:true}];
let orders=[]; let cart={};
function yen(n){return Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function init(){ await loadAll(); renderTexts(); renderProducts(); }
async function loadAll(){ if(!isConfigured){ const p=localStorage.getItem('xb_products'); const st=localStorage.getItem('xb_settings'); if(p) products=JSON.parse(p); if(st) settings={...DEFAULT_SETTINGS,...JSON.parse(st)}; return; }
  const [pRes,sRes]=await Promise.all([sb.from('products').select('*').order('sort_order',{ascending:true}),sb.from('settings').select('*').eq('id','main').maybeSingle()]);
  if(pRes.data && pRes.data.length) products=pRes.data; if(sRes.data) settings={...DEFAULT_SETTINGS,...sRes.data.data};
}
function renderTexts(){ for(const [k,v] of Object.entries(settings)){ const el=document.getElementById(k); if(el) el.textContent=v; } document.title=settings.siteTitle || '小贝订单'; }
function renderProducts(){ const box=document.getElementById('products'); box.innerHTML=''; products.filter(p=>p.active!==false).forEach(p=>{ cart[p.id]=cart[p.id]||0; const soldOut=Number(p.stock)<=0; box.insertAdjacentHTML('beforeend',`<div class="product"><div class="pic">🐚</div><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.desc)}<br>${yen(p.price)}日元/个｜剩余 <b class="${soldOut?'danger':''}">${yen(p.stock)}</b> 个</div></div><div class="qty"><button type="button" onclick="changeQty('${p.id}',-1)">−</button><input id="qty_${p.id}" value="${cart[p.id]}" readonly><button type="button" onclick="changeQty('${p.id}',1)" ${soldOut?'disabled':''}>＋</button></div></div>`); }); calcTotal(); }
function changeQty(id,d){const p=products.find(x=>x.id===id); cart[id]=Math.max(0,Math.min(Number(p.stock||0),(cart[id]||0)+d)); document.getElementById('qty_'+id).value=cart[id]; calcTotal();}
function calcTotal(){let t=0; products.forEach(p=>t+=(cart[p.id]||0)*Number(p.price||0)); document.getElementById('total').textContent=yen(t); return t;}
document.getElementById('orderForm').addEventListener('submit',async e=>{ e.preventDefault(); const items=products.filter(p=>(cart[p.id]||0)>0).map(p=>({product_id:p.id,name:p.name,qty:cart[p.id],price:Number(p.price)})); if(!items.length){alert('请至少选择一个商品');return;} const total=calcTotal(); const order={order_no:'XB'+Date.now().toString().slice(-8),wechat:wechat.value,phone:phone.value,address:address.value,area:area.value,delivery_time:delivery.value,pay_method:pay.value,memo:memo.value,items,total,status:'未确认'}; submitBtn.disabled=true; submitBtn.textContent='提交中...'; try{ if(isConfigured){ const {error}=await sb.from('orders').insert(order); if(error) throw error; for(const it of items){ const p=products.find(x=>x.id===it.product_id); await sb.from('products').update({stock:Number(p.stock)-it.qty}).eq('id',p.id); } }else{ const os=JSON.parse(localStorage.getItem('xb_orders')||'[]'); os.push({...order,created_at:new Date().toISOString()}); localStorage.setItem('xb_orders',JSON.stringify(os)); items.forEach(it=>{const p=products.find(x=>x.id===it.product_id); p.stock-=it.qty}); localStorage.setItem('xb_products',JSON.stringify(products)); }
  document.getElementById('success').style.display='block'; document.getElementById('success').innerHTML=`提交成功！订单编号：<b>${order.order_no}</b><br>合计：<b>${yen(total)}日元</b><br>请截图并联系店主确认付款。`; e.target.reset(); cart={}; await loadAll(); renderProducts(); }catch(err){ alert('提交失败：'+err.message); } finally{ submitBtn.disabled=false; submitBtn.textContent='提交订单'; }});
function openAdminModal(){adminMask.style.display='block'} function closeAdminModal(){adminMask.style.display='none'}
async function loginAdmin(){ if(adminPass.value!==ADMIN_PASSWORD){alert('密码错误');return;} loginBox.style.display='none'; adminBox.style.display='block'; if(!isConfigured){dbWarn.style.display='block';dbWarn.textContent='现在是本地测试模式：还没连接 Supabase，别人提交的订单你看不到。等填入 Supabase URL 和 Key 后就会变成线上收单模式。'} renderStockEditor(); renderTextEditor(); await loadOrders(); }
function showTab(id,btn){document.querySelectorAll('.adminSection').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function loadOrders(){ if(isConfigured){ const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}); if(error){alert(error.message);return;} orders=data||[]; }else orders=JSON.parse(localStorage.getItem('xb_orders')||'[]'); renderOrders(); }
function renderOrders(){ const b=document.getElementById('orders'); if(!orders.length){b.innerHTML='<p class="small">暂无订单</p>';return;} const sorted=[...orders].sort((a,b)=>(a.area||'').localeCompare(b.area||'')||(a.delivery_time||'').localeCompare(b.delivery_time||'')); b.innerHTML='<table><tr><th>区域/时间</th><th>客户</th><th>商品</th><th>地址</th><th>金额</th></tr>'+sorted.map(o=>`<tr><td><span class="pill">${esc(o.area)}</span><br>${esc(o.delivery_time)}</td><td>${esc(o.wechat)}<br>${esc(o.phone||'')}<br>${esc(o.order_no)}</td><td>${(o.items||[]).map(i=>esc(i.name)+'×'+i.qty).join('<br>')}</td><td>${esc(o.address)}<br>${esc(o.memo||'')}</td><td>${yen(o.total)}</td></tr>`).join('')+'</table>'; }
function renderStockEditor(){ const b=document.getElementById('stockEditor'); b.innerHTML=''; products.forEach((p,i)=>b.insertAdjacentHTML('beforeend',`<div class="card"><label>商品ID</label><input id="pid${i}" value="${esc(p.id)}"><label>商品名</label><input id="pn${i}" value="${esc(p.name)}"><div class="row"><div><label>价格</label><input id="pp${i}" type="number" value="${p.price}"></div><div><label>库存</label><input id="ps${i}" type="number" value="${p.stock}"></div></div><label>说明</label><input id="pd${i}" value="${esc(p.desc||'')}"><label><input id="pa${i}" type="checkbox" ${p.active!==false?'checked':''} style="width:auto"> 显示这个商品</label></div>`)); }
function addProduct(){products.push({id:'item'+Date.now().toString().slice(-4),name:'新商品',price:300,stock:0,desc:'',active:true});renderStockEditor();}
async function saveProducts(){ products=products.map((p,i)=>({id:document.getElementById('pid'+i).value.trim(),name:document.getElementById('pn'+i).value,price:+document.getElementById('pp'+i).value,stock:+document.getElementById('ps'+i).value,desc:document.getElementById('pd'+i).value,active:document.getElementById('pa'+i).checked,sort_order:i})); if(isConfigured){ for(const p of products){ const {error}=await sb.from('products').upsert(p); if(error){alert(error.message);return;} } } else localStorage.setItem('xb_products',JSON.stringify(products)); renderProducts(); alert('已保存商品/库存'); }
function renderTextEditor(){ const b=document.getElementById('textEditor'); b.innerHTML=''; Object.keys(DEFAULT_SETTINGS).forEach(k=>b.insertAdjacentHTML('beforeend',`<div><label>${k}</label><textarea id="set_${k}">${esc(settings[k]||'')}</textarea></div>`)); }
async function saveSettings(){ Object.keys(DEFAULT_SETTINGS).forEach(k=>settings[k]=document.getElementById('set_'+k).value); if(isConfigured){ const {error}=await sb.from('settings').upsert({id:'main',data:settings}); if(error){alert(error.message);return;} } else localStorage.setItem('xb_settings',JSON.stringify(settings)); renderTexts(); alert('已保存页面文案'); }
function exportCSV(){const rows=[['订单号','下单时间','微信名','电话','区域','地址','送达时间','商品','付款','金额','备注']]; orders.forEach(o=>rows.push([o.order_no,o.created_at,o.wechat,o.phone,o.area,o.address,o.delivery_time,(o.items||[]).map(i=>`${i.name}x${i.qty}`).join(' / '),o.pay_method,o.total,o.memo])); const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='xiaobei_orders.csv'; a.click();}
init();
</script>
</body>
</html>
